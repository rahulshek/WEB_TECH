<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login Page</title>

    <link rel="stylesheet" href="output.css" />
  </head>

  <body class="">
    <div class="w-full h-screen  bg-white rounded-3xl overflow-hidden flex">
      <div class="w-[50%] flex flex-col justify-center items-center p-12">
        <h1 class="text-3xl font-bold mb-2">LOGIN</h1>
        <p class="text-gray-400 mb-8">
          How to i get started lorem ipsum dolor at?
        </p>

        <div class="w-full mb-4">
          <input
            type="text"
            placeholder="Username"
            class="w-full bg-gray-100 p-3 rounded-xl outline-none"
          />
        </div>
        <div class="w-full mb-6">
          <input
            type="password"
            placeholder="Password"
            class="w-full bg-gray-100 p-3 rounded-xl outline-none"
          />
        </div>

        <button
          class="bg-gradient-to-r from-purple-500 to-indigo-600 text-white px-10 py-3 rounded-xl shadow-lg mb-6"
        >
          Login Now
        </button>

        <p class="text-gray-500 mb-4">Login with Others</p>

        <button
          class="w-full border rounded-xl p-3 flex items-center justify-center gap-2 mb-3 hover:bg-gray-50"
        >
          <img
            src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg"
            class="w-5"
          />
          Loggin With <strong>google</strong>
        </button>

        <button
          class="w-full border rounded-xl p-3 flex items-center justify-center gap-2 hover:bg-gray-50"
        >
          <img
            src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/facebook/facebook-original.svg"
            class="w-5"
          />
          Login with <strong>Facebook</strong>
        </button>
      </div>

      <div
        class="w-1/2 bg-gradient-to-br from-purple-600 to-indigo-600 flex items-center justify-center relative"
      >
        <div class="bg-white/10 backdrop-blur-lg rounded-3xl p-10">
          <img src="./image.png" class="w-64 rounded-2xl" />
        </div>
      </div>
    </div>
  </body>
</html>
