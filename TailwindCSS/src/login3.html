<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login Page</title>

    <link rel="stylesheet" href="output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body class="">
    <div class="w-full h-screen bg-white overflow-hidden flex">
      <div class="w-[50%] flex justify-center items-center">
        <div class="w-[50%] flex flex-col justify-center items-center p-12">
          <h1 class="text-3xl font-bold mb-2">LOGIN</h1>
          <p class="text-gray-400 mb-8">How to i get started lorem dolor at?</p>

          <div class="w-full mb-4 relative">
            <input
              type="text"
              placeholder="Username"
              class="w-full bg-gray-100 p-3 rounded-xl outline-none pl-10"
            />
            <i class="fa-solid fa-user absolute left-2 top-4"></i>
          </div>
          <div class="w-full mb-6 relative">
            <input
              type="password"
              placeholder="Password"
              class="w-full bg-gray-100 p-3 rounded-xl outline-none pl-10"
            />
            <i class="fa-solid fa-lock absolute left-2 top-4"></i>
          </div>

          <button
            class="bg-linear-to-r from-purple-500 to-indigo-600 text-white px-10 py-3 shadow-lg rounded-2xl mb-6 hover:bg-linear-to-l transition-all duration-300 ease-in-out"
          >
            Login Now
          </button>

          <p class="text-gray-500 mb-4"><strong>Login</strong> with Others</p>

          <button
            class="w-full rounded-xl p-3 flex items-center justify-center gap-2 mb-3 hover:bg-gray-50"
          >
            <img
              src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg"
              class="w-5"
            />
            Loggin With <strong>google</strong>
          </button>

          <button
            class="w-full rounded-xl p-3 flex items-center justify-center gap-2 hover:bg-gray-50"
          >
            <img
              src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/facebook/facebook-original.svg"
              class="w-5"
            />
            Login with <strong>Facebook</strong>
          </button>
        </div>
      </div>

      <div
        class="w-1/2 bg-linear-to-br from-purple-600 to-indigo-600 flex items-center justify-center relative"
      >
        <div
          class="bg-[rgba(255,255,255,0.2)] rounded-3xl p-10 w-103 h-131 flex justify-end"
        >
          <img
            src="./img1.png"
            class="rounded-2xl bottom-21 right-10 absolute"
          />
          <img
            src="./image.png"
            alt=""
            class="w-[79px] h-[79px] absolute bottom-40 left-35"
          />
        </div>
      </div>
    </div>
  </body>
</html>
