<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login page</title>
    <link rel="stylesheet" href="./output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <section
      class="w-full h-screen bg-slate-900 text-gray-800 flex justify-center items-center"
    >
      <main class="w-[30%] bg-white rounded-lg">
        <header class="w-full p-6">
          <h1 class="text-3xl font-semibold text-center">Login</h1>
        </header>
        <form class="w-full flex flex-col px-10 py-6 gap-3">
          <div class="w-full flex flex-col gap-1 relative">
            <label for="" class="text-lg font-semibold text-gray-600">Email</label>
            <input
              type="email"
              name=""
              id=""
              placeholder="Ente your email"
              class="border border-gray-300 outline-none p-2 rounded focus:ring-2 focus:ring-indigo-600 focus:shadow-lg"
            />
            <span class="absolute top-10 right-4 text-gray-400"
              ><i class="fa-solid fa-envelope"></i
            ></span>
          </div>
          <div class="w-full flex flex-col gap-1 relative">
            <label for="" class="text-lg font-semibold">Password</label>
            <input
              type="password"
              name=""
              id=""
              placeholder="Enter a password"
              class="border border-gray-300 outline-none p-2 rounded focus:ring-2 focus:ring-indigo-600 focus:shadow-lg"
            />
            <span class="absolute top-10 right-4 text-gray-400"
              ><i class="fa-solid fa-lock"></i
            ></span>
          </div>
          <div class="w-full flex justify-between gap-1">
            <label for="">
              <input
                type="checkbox"
                name=""
                id=""
                class="border border-gray-300 outline-none p-4 rounded accent-indigo-600 w-4 h-4"
              />
              Remember Me
            </label>
            <a
              href=""
              class="text-indigo-500 font-semibold hover:underline hover:text-indigo-600 transition-all duration-300 ease-linear"
              >Forgot Password?</a
            >
          </div>
          <div class="w-full flex flex-col gap-1 my-2">
            <button
              class="bg-indigo-500 py-2 text-white text-lg font-semibold cursor-pointer rounded hover:scale-105 transition-all duration-150 ease-linear"
            >
              Sign in
            </button>
          </div>
          <div class="w-full flex justify-center gap-1">
            <a href=""
              >Don't have an account?
              <span
                class="text-indigo-500 font-semibold hover:underline hover:text-indigo-600 transition-all duration-300 ease-linear"
                >Create account</span
              ></a
            >
          </div>
        </form>
      </main>
    </section>
  </body>
</html>
