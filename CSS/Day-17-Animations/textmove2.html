<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .parent {
        width: 100%;
        height: 68px;
        background-color: beige;
        display: flex;
        align-items: center;
        overflow: hidden;
      }
      span {
        color: rebeccapurple;
        animation: textmoving 10s linear infinite;
      }
      @keyframes textmoving {
        from {
          transform: translateX(90vw);
        }
        to {
          transform: translateX(-300%);
        }
      }
    </style>
  </head>
  <body>
    <div class="parent">
      <span>🚀Big Sales Today | </span>
      <span>🚀Big Sales Today | </span>
      <span>🚀Big Sales Today | </span>
    </div>
  </body>
</html>
