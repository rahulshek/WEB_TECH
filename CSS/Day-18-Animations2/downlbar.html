<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0px;
        margin: 0px;
        box-sizing: border-box;
      }
      body {
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 20px;
        background-color: peru;
      }
      .download-path {
        width: 90%;
        padding: 5px;
        border: 1px solid rgb(183, 181, 181);
        border-radius: 30px;
      }
      .downloader {
        height: 30px;
        background-color: mediumslateblue;
        border-radius: 30px;
        animation: download 5s steps(5);
      }
      @keyframes download {
        from {
          width: 0%;
        }
        to {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <h1>Downloading Bar Demo in CSS</h1>
    <div class="download-path">
      <div class="downloader"></div>
    </div>
  </body>
</html>
