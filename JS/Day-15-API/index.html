<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fake Store</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {},
        },
        plugins: [tailwindcssLineClamp],
      };
    </script>
  </head>

  <body class="bg-gray-100">
    <!-- Navbar -->
    <nav class="bg-blue-600 text-white p-4 shadow-md">
      <h1 class="text-2xl font-bold text-center">🛍 Fake Store</h1>
    </nav>

    <!-- Loader -->
    <div id="loader" class="text-center mt-10 text-xl font-semibold">
      Loading products...
    </div>

    <!-- Product Container -->
    <div
      id="product-container"
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 p-6"
    ></div>

    <script src="script.js"></script>
  </body>
</html>
